name: DART 공시 알림

on:
  schedule:
    # GitHub 시간은 UTC 기준 (한국시간 = UTC + 9)
    - cron: "*/5 22,23,0-12 * * *"   # 한국시간 07~21시: 5분마다
    - cron: "*/30 13-21 * * *"       # 한국시간 22~06시: 30분마다
  workflow_dispatch: {}              # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write                    # 확인한 공시 기록(seen.json) 저장용

concurrency:
  group: dart-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 새 공시 확인
        run: python dart_telegram_bot.py --once
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPANIES: "삼성전자,SK하이닉스,리브스메드"

      - name: 확인 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json corp_codes.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "공시 확인 기록 업데이트"
            git pull --rebase
            git push
          fi
